spring.application.name=userapp

# H2 en memoria — base de datos embebida para desarrollo
spring.datasource.url=jdbc:h2:mem:userappdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 — accesible en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator — endpoints de monitorización
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── JWT ──────────────────────────────────────────────────────────────────────
# Clave secreta para firmar los tokens con HS256 (mínimo 32 caracteres / 256 bits).
# En producción debe venir de una variable de entorno — NUNCA subir una clave real a git.
app.jwt.secret=claveSecretaMuyLargaParaHS256DeAlMenos32Chars!
# Tiempo de vida del token en milisegundos (86400000 ms = 24 horas).
# Pasado este tiempo, el servidor rechazará el token con 401.
app.jwt.expiration=86400000
